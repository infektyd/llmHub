# SwiftLint Configuration
# Adjusted thresholds for the llmHub codebase

# Rules disabled as they would require extensive refactoring
disabled_rules:
  - todo
  - large_tuple
  - multiple_closures_with_trailing_closure
  - force_try
  - cyclomatic_complexity
  - orphaned_doc_comment
  - force_unwrapping
  - implicitly_unwrapped_optional
  - no_empty_block
  - trailing_closure
  - indentation_width
  - redundant_type_annotation
  - number_separator
  - static_over_final_class
  - superfluous_disable_command
  - non_optional_string_data_conversion  # Legacy APIs, safe in context
  - for_where                            # if-let patterns inside loops are sometimes clearer
  - redundant_string_enum_value          # Explicit values aid readability
  - type_name                            # Test class names follow XCTest conventions
  - closure_body_length                  # SwiftUI closures are naturally large

# Identifier naming - allow short names
identifier_name:
  min_length:
    warning: 1
    error: 1
  allowed_symbols: ["_"]
  validates_start_with_lowercase: error

# Line length
line_length:
  warning: 185
  error: 250
  ignores_urls: true
  ignores_interpolated_strings: true
  ignores_comments: true
  ignores_function_declarations: true

# Function body length
function_body_length:
  warning: 150
  error: 400

# File length
file_length:
  warning: 1750
  error: 3000
  ignore_comment_only_lines: true

# Type body length
type_body_length:
  warning: 600
  error: 1200

# Nesting
nesting:
  type_level:
    warning: 2
    error: 3
  function_level:
    warning: 3
    error: 5

# Function parameter count
function_parameter_count:
  warning: 9
  error: 10

# Trailing commas
opt_in_rules:
  - trailing_comma

trailing_comma:
  mandatory_comma: true
